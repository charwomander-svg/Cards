name: Integration tests

on:
  push:
    branches: [ main, 'charwomander-svg-card-game-rules-list' ]
  pull_request:
    branches: [ main ]

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      DOTNET_HTTP_PORT: 5000
      RUN_INTEGRATION: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Start adapter
        run: |
          dotnet run --project web-adapter --no-build --configuration Release &
          echo "Waiting for adapter to start..."
          for i in {1..30}; do
            if curl -sSf http://localhost:${{ env.DOTNET_HTTP_PORT }}/api/health >/dev/null 2>&1; then
              echo "Adapter ready"; break
            fi
            sleep 1
          done

      - name: Run integration tests
        run: |
          # RUN_INTEGRATION=1 causes the integration test to run; others return early
          dotnet test --no-build -c Release --logger "trx"

      - name: Tear down adapter
        run: |
          # try to kill any dotnet process (best-effort)
          pkill -f "dotnet run --project web-adapter" || true
